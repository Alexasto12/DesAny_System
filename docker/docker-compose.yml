version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: desany-postgres
    environment:
      POSTGRES_USER: desany
      POSTGRES_PASSWORD: desany
      POSTGRES_DB: desany
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desany"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - desany-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: desany-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - desany-network
    restart: unless-stopped

  llm-server:
    build:
      context: ../apps/llm-server
      dockerfile: Dockerfile
    container_name: desany-llm
    ports: ["8000:8000"]
    environment:
      MODEL_NAME: "Qwen/Qwen3-30B-A3B"
      TENSOR_PARALLEL_SIZE: "1"
      MAX_MODEL_LEN: "8192"
      GPU_MEM_UTIL: "0.90"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [desany-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  scraper:
    build:
      context: ..
      dockerfile: apps/scraper/Dockerfile
    container_name: desany-scraper
    env_file: ../.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [desany-network]
    restart: unless-stopped

  email-service:
    build:
      context: ..
      dockerfile: apps/email-service/Dockerfile
    container_name: desany-email
    env_file: ../.env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - desany-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  desany-network:
    driver: bridge
